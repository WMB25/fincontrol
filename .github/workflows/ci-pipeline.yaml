name: FinControl - CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Pipeline de Integracao Continua
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar o Projeto
        run: mvn clean compile

      - name: Executar Testes de Unidade
        run: mvn test

      - name: Log de Etapas Futuras (Qualidade e Cobertura)
        run: echo "Cobertura JaCoCo e Qualidade SonarQube serao ativados nas proximas."

      - name: Gerar Artefato (Package)
        run: mvn package -DskipTests